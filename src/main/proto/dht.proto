syntax = "proto2";

package dht.pb;

option java_package = "com.libp2p.kademlia.pb";
option java_outer_classname = "Dht";

message Record {
    required bytes key = 1;
    optional bytes value = 2;
    optional bytes publisher = 3;
    optional uint32 ttl = 4;
    optional string timeReceived = 5;
}

message Message {
    enum MessageType {
        PUT_VALUE = 0;
        GET_VALUE = 1;
        ADD_PROVIDER = 2;
        GET_PROVIDERS = 3;
        FIND_NODE = 4;
        PING = 5;
    }

    enum ConnectionType {
        NOT_CONNECTED = 0;
        CONNECTED = 1;
        CAN_CONNECT = 2;
        CANNOT_CONNECT = 3;
    }

    message Peer {
        required bytes id = 1;
        repeated bytes addrs = 2;
        optional ConnectionType connection = 3 [default = NOT_CONNECTED];
    }

    required MessageType type = 1;
    optional bytes key = 2;
    optional Record record = 3;
    repeated Peer closerPeers = 8;
    repeated Peer providerPeers = 9;
    optional int32 clusterLevelRaw = 10;
}
