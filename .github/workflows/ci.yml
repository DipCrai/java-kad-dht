name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: interop/go/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust/target
          key: cargo-${{ hashFiles('interop/rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Build Java
        run: ./gradlew build -x test

      - name: Build Go harness
        working-directory: interop/go
        run: go build -o go-node .

      - name: Build Rust harness
        working-directory: interop/rust
        run: cargo build --release

      - name: Run unit tests
        run: ./gradlew test -i

      - name: Start Go node
        run: |
          ./interop/go/go-node > /tmp/go-out.txt 2>/tmp/go-err.txt &
          GO_PID=$!
          echo "GO_PID=$GO_PID" >> $GITHUB_ENV

          for i in $(seq 1 10); do
            if [ -s /tmp/go-out.txt ]; then
              GO_ADDR=$(head -1 /tmp/go-out.txt)
              echo "GO_ADDR=$GO_ADDR" >> $GITHUB_ENV
              echo "Go node ready: $GO_ADDR"
              break
            fi
            if ! kill -0 $GO_PID 2>/dev/null; then
              echo "Go node died"
              cat /tmp/go-err.txt
              exit 1
            fi
            sleep 1
          done

          if [ -z "$GO_ADDR" ]; then
            echo "Go node failed to start within 10s"
            cat /tmp/go-err.txt
            exit 1
          fi

      - name: Start Rust node
        run: |
          ./interop/rust/target/release/kad-rust-node > /tmp/rust-out.txt 2>/tmp/rust-err.txt &
          RUST_PID=$!
          echo "RUST_PID=$RUST_PID" >> $GITHUB_ENV

          for i in $(seq 1 10); do
            if [ -s /tmp/rust-out.txt ]; then
              RUST_ADDR=$(head -1 /tmp/rust-out.txt)
              echo "RUST_ADDR=$RUST_ADDR" >> $GITHUB_ENV
              echo "Rust node ready: $RUST_ADDR"
              break
            fi
            if ! kill -0 $RUST_PID 2>/dev/null; then
              echo "Rust node died"
              cat /tmp/rust-err.txt
              exit 1
            fi
            sleep 1
          done

          if [ -z "$RUST_ADDR" ]; then
            echo "Rust node failed to start within 10s"
            cat /tmp/rust-err.txt
            exit 1
          fi

      - name: Run interop tests
        run: |
          ./gradlew test \
            --tests "com.libp2p.kademlia.InteropDht.*" \
            -Dinterop.go="${{ env.GO_ADDR }}" \
            -Dinterop.rust="${{ env.RUST_ADDR }}" \
            --rerun-tasks -i

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          cp /tmp/go-err.txt /tmp/ci-logs/ 2>/dev/null || true
          cp /tmp/rust-err.txt /tmp/ci-logs/ 2>/dev/null || true
          cp /tmp/go-out.txt /tmp/ci-logs/ 2>/dev/null || true
          cp /tmp/rust-out.txt /tmp/ci-logs/ 2>/dev/null || true
          cp -r build/reports/tests/test /tmp/ci-logs/test-report/ 2>/dev/null || true
          cp -r build/test-results/test /tmp/ci-logs/test-results/ 2>/dev/null || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/ci-logs/
          retention-days: 7

      - name: Kill background processes
        if: always()
        run: |
          for sig in TERM TERM KILL; do
            for pid in ${{ env.GO_PID }} ${{ env.RUST_PID }}; do
              if kill -0 "$pid" 2>/dev/null; then
                kill -$sig "$pid" 2>/dev/null || true
              fi
            done
            sleep 1
          done
          pkill -f "go-node" 2>/dev/null || true
          pkill -f "kad-rust-node" 2>/dev/null || true
          sleep 1
          remaining=$(ps aux | grep -E "go-node|kad-rust-node" | grep -v grep | wc -l)
          if [ "$remaining" -gt 0 ]; then
            echo "WARNING: $remaining processes still alive after cleanup"
            ps aux | grep -E "go-node|kad-rust-node" | grep -v grep
          fi
