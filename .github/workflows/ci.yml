name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: interop/go/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            interop/rust/target
          key: cargo-${{ hashFiles('interop/rust/Cargo.lock') }}
          restore-keys: cargo-

      - name: Build Java
        run: ./gradlew build -x test

      - name: Build Go harness
        working-directory: interop/go
        run: go build -o go-node .

      - name: Build Rust harness
        working-directory: interop/rust
        run: cargo build --release

      - name: Run unit tests
        run: ./gradlew test --tests "com.libp2p.kademlia.KadDhtTest" -i
        continue-on-error: true

      - name: Start Go node
        run: |
          cd interop/go
          ./go-node > /tmp/go-out.txt 2>/tmp/go-err.txt &
          echo "GO_PID=$!" >> $GITHUB_ENV
          sleep 2
          GO_ADDR=$(head -1 /tmp/go-out.txt)
          echo "GO_ADDR=$GO_ADDR" >> $GITHUB_ENV
          echo "Go node started: $GO_ADDR"

      - name: Start Rust node
        run: |
          cd interop/rust
          ./target/release/kad-rust-node > /tmp/rust-out.txt 2>/tmp/rust-err.txt &
          echo "RUST_PID=$!" >> $GITHUB_ENV
          sleep 2
          RUST_ADDR=$(head -1 /tmp/rust-out.txt)
          echo "RUST_ADDR=$RUST_ADDR" >> $GITHUB_ENV
          echo "Rust node started: $RUST_ADDR"

      - name: Run interop tests
        run: |
          ./gradlew test \
            --tests "com.libp2p.kademlia.InteropDht.*" \
            -Dinterop.go="${{ env.GO_ADDR }}" \
            -Dinterop.rust="${{ env.RUST_ADDR }}" \
            --rerun-tasks -i

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          cp /tmp/go-err.txt /tmp/ci-logs/ 2>/dev/null || true
          cp /tmp/rust-err.txt /tmp/ci-logs/ 2>/dev/null || true
          cp -r build/reports/tests/test /tmp/ci-logs/test-report/ 2>/dev/null || true
          cp -r build/test-results/test /tmp/ci-logs/test-results/ 2>/dev/null || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/ci-logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          kill ${{ env.GO_PID }} ${{ env.RUST_PID }} 2>/dev/null || true
