plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
    id 'maven-publish'
}

group = 'io.libp2p'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://dl.cloudsmith.io/public/libp2p/jvm-libp2p/maven/" }
    maven { url "https://jitpack.io" }
    maven { url "https://artifacts.consensys.net/public/maven/maven/" }
}

dependencies {
    api 'io.libp2p:jvm-libp2p:1.3.5-RELEASE'

    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    implementation 'io.netty:netty-all:4.1.108.Final'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
}

test {
    useJUnitPlatform()
    systemProperty "interop.nodes", System.getProperty("interop.nodes", "")
    systemProperty "interop.go", System.getProperty("interop.go", "")
    systemProperty "interop.rust", System.getProperty("interop.rust", "")
    systemProperty "interop.go-passthru", System.getProperty("interop.go-passthru", "")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${rootProject.buildDir}/maven-repo")
        }
    }
}
