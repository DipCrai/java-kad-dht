plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
    id 'maven-publish'
}

group = 'com.github.dipcrai'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url "https://dl.cloudsmith.io/public/libp2p/jvm-libp2p/maven/" }
    maven { url "https://jitpack.io" }
    maven { url "https://artifacts.consensys.net/public/maven/maven/" }
}

dependencies {
    api 'io.libp2p:jvm-libp2p:1.3.5-RELEASE'

    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    implementation 'io.netty:netty-all:4.1.108.Final'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
}

test {
    useJUnitPlatform()
    systemProperty "interop.nodes", System.getProperty("interop.nodes", "")
    systemProperty "interop.go", System.getProperty("interop.go", "")
    systemProperty "interop.rust", System.getProperty("interop.rust", "")
    systemProperty "interop.go-passthru", System.getProperty("interop.go-passthru", "")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'java-kad-dht'
                description = 'Full Kademlia DHT implementation for jvm-libp2p'
                url = 'https://github.com/DipCrai/java-kad-dht'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            url = uri("${rootProject.buildDir}/maven-repo")
        }
    }
}

tasks.register('kadSingleNodeProbe', JavaExec) {
    group = 'verification'
    description = 'temp: single host, per-seed FIND_NODE to test kad interop'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.libp2p.kademlia.KadSingleNodeProbe'
    jvmArgs "-Dkad.extra=${System.getProperty('kad.extra','')}"
}

tasks.register('kadCrawlProbe', JavaExec) {
    group = 'verification'
    description = 'temp: iterative kad crawl to prove liveliness auto-growth'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.libp2p.kademlia.KadCrawlProbe'
    jvmArgs "-Dkad.extra=${System.getProperty('kad.extra','')}"
    jvmArgs "-Dkad.levels=${System.getProperty('kad.levels','1')}"
    jvmArgs "-Dkad.perlevel=${System.getProperty('kad.perlevel','25')}"
}

tasks.register('kadOfficialProbe', JavaExec) {
    group = 'verification'
    description = 'temp: deep diagnosis of kad RPC against official bootstrap nodes'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.libp2p.kademlia.KadOfficialProbe'
    jvmArgs "-Dkad.extra=${System.getProperty('kad.extra','')}"
}

tasks.register('kadHttpE2EProbe', JavaExec) {
    group = 'verification'
    description = 'temp: provider round-trip A provide -> B findProviders over public DHT'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.libp2p.kademlia.HttpBootstrapE2EProbe'
}

tasks.register('kadHttpFallbackProbe', JavaExec) {
    group = 'verification'
    description = 'temp: e2e bootstrap via HTTPS routing fallback (no VPN required)'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.libp2p.kademlia.HttpBootstrapFallbackProbe'
    jvmArgs "-Dkad.empty=${System.getProperty('kad.empty','false')}"
}
